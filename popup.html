<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AfterWatch</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <h1>AfterWatch</h1>
      <p class="intro" data-i18n="intro">You've watched it. Now join the conversation.</p>
      <div class="language-row">
        <label for="language" data-i18n="language">Language</label>
        <select id="language">
          <option value="en" lang="en">English</option>
          <option value="es" lang="es">Español</option>
          <option value="pt" lang="pt">Português</option>
          <option value="it" lang="it">Italiano</option>
          <option value="tr" lang="tr">Türkçe</option>
        </select>
      </div>
      <p id="languageStatus" class="detail" role="status" hidden></p>
    </header>
    <section class="film-card" aria-label="Media selection" data-i18n-aria="selection" tabindex="0">
      <label for="mediaType" data-i18n="typeLabel">Content type</label>
      <select id="mediaType">
        <option value="movie" data-i18n="movie">Movie</option>
        <option value="series" data-i18n="series">TV series</option>
        <option value="episode" data-i18n="episode">TV episode</option>
      </select>
      <label id="titleLabel" for="filmTitle" data-i18n="titleLabel">Title to search</label>
      <input id="filmTitle" type="text" maxlength="180" placeholder="e.g. Raw or a series title" data-i18n-placeholder="placeholder" autocomplete="off" spellcheck="false" aria-describedby="status filmDetail">
      <div id="episodeControls" hidden>
        <div class="episode-numbers">
          <div><label for="seasonNumber" data-i18n="seasonLabel">Season</label><input id="seasonNumber" type="number" min="0" max="999" step="1" inputmode="numeric" aria-describedby="eksiRoute"></div>
          <div><label for="episodeNumber" data-i18n="episodeLabel">Episode</label><input id="episodeNumber" type="number" min="1" max="9999" step="1" inputmode="numeric" aria-describedby="eksiRoute"></div>
        </div>
        <label for="discussionScope" data-i18n="scopeLabel">Discussion scope</label>
        <select id="discussionScope">
          <option value="series" data-i18n="scopeSeries">Entire series</option>
          <option value="episode" data-i18n="scopeEpisode">This episode</option>
        </select>
      </div>
      <p id="filmDetail" class="detail"></p>
      <div id="alternatives" aria-label="Other titles found on this page" data-i18n-aria="otherTitles"></div>
      <p id="status" role="status" aria-live="polite">Reading movie or TV information…</p>
      <p id="spoilerNote" class="detail" data-i18n="spoiler" hidden></p>
    </section>
    <div class="destinations">
      <button id="eksiBtn" class="destination eksi" type="button" disabled>
        <span class="destination-name">Ekşi Sözlük <span aria-hidden="true">↗</span></span>
        <span class="destination-description" data-i18n="eksiDescription">Explore discussions in Turkish</span>
        <span id="eksiRoute" class="route"></span>
      </button>
      <button id="letterboxdBtn" class="destination letterboxd" type="button" disabled>
        <span class="destination-name">Letterboxd <span aria-hidden="true">↗</span></span>
        <span class="destination-description" data-i18n="letterboxdDescription">Read reviews and rate on Letterboxd</span>
        <span id="letterboxdRoute" class="route">Search by movie title</span>
      </button>
    </div>
    <footer data-i18n="footer">Opens a new tab only when you click. Only your language preference is saved; no watch history.</footer>
  </main>
  <script src="film.js"></script>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
